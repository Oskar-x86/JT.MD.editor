name: Build Android 16 (API 36) APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (API Level 36)
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK Platform (android-36)
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0"

      - name: Build Debug & Release Signed APK via Gradle
        uses: gradle/actions/setup-gradle@v4
      - run: gradle assembleDebug assembleRelease

      - name: Upload Compiled Android 16 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JotterPad-Offline-Android16-APK
          path: app/build/outputs/apk/**/*.apk
